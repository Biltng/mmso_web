name: Pre-Deployment Checks

# ✅ Runs on every push and pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ✅ Job 1: Install and Build
  build-check:
    name: 🔨 Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript check
        run: npx tsc --noEmit

      - name: 🔨 Build project
        run: npm run build

  # ✅ Job 2: Check Important Files Exist
  file-checks:
    name: 📄 File Checks
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: ✅ Check sitemap.xml exists
        run: |
          if [ -f "dist/sitemap.xml" ]; then
            echo "✅ sitemap.xml found"
          else
            echo "❌ sitemap.xml MISSING"
            exit 1
          fi

      - name: ✅ Check robots.txt exists
        run: |
          if [ -f "dist/robots.txt" ]; then
            echo "✅ robots.txt found"
          else
            echo "❌ robots.txt MISSING"
            exit 1
          fi

      - name: ✅ Check logo exists
        run: |
          if [ -f "dist/muthimunye-logo.png" ]; then
            echo "✅ muthimunye-logo.png found"
          else
            echo "❌ muthimunye-logo.png MISSING"
            exit 1
          fi

      - name: ✅ Check index.html has meta tags
        run: |
          if grep -q "google-site-verification" dist/index.html; then
            echo "✅ Google verification tag found"
          else
            echo "❌ Google verification tag MISSING"
            exit 1
          fi

      - name: ✅ Check index.html has OG tags
        run: |
          if grep -q "og:title" dist/index.html; then
            echo "✅ Open Graph tags found"
          else
            echo "❌ Open Graph tags MISSING"
            exit 1
          fi

  # ✅ Job 3: Security and SEO Checks
  seo-security-checks:
    name: 🔒 SEO & Security Checks
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: ✅ Check sitemap has correct domain
        run: |
          if grep -q "https://mmso.co.za" dist/sitemap.xml; then
            echo "✅ Correct domain in sitemap"
          else
            echo "❌ Wrong domain in sitemap"
            exit 1
          fi

      - name: ✅ Check robots.txt has sitemap reference
        run: |
          if grep -q "Sitemap:" dist/robots.txt; then
            echo "✅ Sitemap referenced in robots.txt"
          else
            echo "❌ Sitemap NOT referenced in robots.txt"
            exit 1
          fi

      - name: ✅ Check no console.log in production code
        run: |
          LOGS=$(grep -r "console.log" src/ --include="*.tsx" --include="*.ts" -l || true)
          if [ -z "$LOGS" ]; then
            echo "✅ No console.log statements found"
          else
            echo "⚠️ Warning: console.log found in:"
            echo "$LOGS"
            echo "Consider removing before production"
          fi

      - name: ✅ Check canonical URLs
        run: |
          if grep -q "mmso.co.za" dist/index.html; then
            echo "✅ Canonical URL correctly set"
          else
            echo "❌ Canonical URL missing or wrong"
            exit 1
          fi

  # ✅ Job 4: Page Route Checks
  route-checks:
    name: 🔗 Route Checks
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Check all page files exist
        run: |
          echo "Checking page files..."
          
          FILES=(
            "src/pages/HomePage.tsx"
            "src/pages/AboutPage.tsx"
            "src/pages/ContactPage.tsx"
            "src/pages/ServicePage.tsx"
            "src/pages/MiningSolutionsPage.tsx"
            "src/pages/DevelopmentPage.tsx"
            "src/pages/PrivacyPolicyPage.tsx"
            "src/pages/TermsPage.tsx"
          )
          
          ALL_FOUND=true
          
          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "✅ $FILE exists"
            else
              echo "❌ $FILE MISSING"
              ALL_FOUND=false
            fi
          done
          
          if [ "$ALL_FOUND" = false ]; then
            exit 1
          fi

      - name: ✅ Check Helmet SEO is on all pages
        run: |
          echo "Checking react-helmet-async usage..."
          
          FILES=(
            "src/pages/HomePage.tsx"
            "src/pages/AboutPage.tsx"
            "src/pages/ContactPage.tsx"
            "src/pages/MiningSolutionsPage.tsx"
            "src/pages/DevelopmentPage.tsx"
            "src/pages/PrivacyPolicyPage.tsx"
            "src/pages/TermsPage.tsx"
          )
          
          ALL_GOOD=true
          
          for FILE in "${FILES[@]}"; do
            if grep -q "react-helmet-async" "$FILE"; then
              echo "✅ $FILE has Helmet SEO"
            else
              echo "❌ $FILE MISSING Helmet SEO"
              ALL_GOOD=false
            fi
          done
          
          if [ "$ALL_GOOD" = false ]; then
            exit 1
          fi
